# Preview channel for preview/rhandar-level — does NOT touch GitHub Pages production.
name: Deploy preview (rhandar-level)

on:
  push:
    branches: [preview/rhandar-level]
    paths:
      - "web/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: rhandar-preview
    steps:
      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROOMCRAFT_E1312 }}
          projectId: roomcraft-e1312
          channelId: rhandar-level
          expires: 30d

      - name: Print preview URL
        run: |
          echo "### Preview URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Firebase Hosting channel **rhandar-level** (production Pages is unchanged)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "details_url: ${{ steps.deploy.outputs.details_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "expire_time: ${{ steps.deploy.outputs.expire_time }}" >> "$GITHUB_STEP_SUMMARY"
